name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci` step on purpose. The suite runs on node:test and imports
      # only from src/, so it needs nothing installed; the one devDependency
      # (foundryvtt-cli) exists for `npm run pack`, which CI does not do.
      - run: npm test
